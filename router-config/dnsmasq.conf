# DNS Interception for Captive Portal
# These domains are used by phones to check internet connectivity
# Redirecting them to router IP triggers captive portal popup

# Android / Google (Samsung, Xiaomi, Redmi, Poco, Vivo, Oppo, etc.)
address=/connectivitycheck.gstatic.com/192.168.1.1
address=/connectivitycheck.android.com/192.168.1.1

# Apple iOS / macOS
address=/captive.apple.com/192.168.1.1
address=/hotspot-detect.html/192.168.1.1

# Windows / Microsoft
address=/www.msftconnecttest.com/192.168.1.1
address=/www.msftncsi.com/192.168.1.1

# Linux / GNOME
address=/nmcheck.gnome.org/192.168.1.1

# Xiaomi / MIUI
address=/connect.rom.miui.com/192.168.1.1

# Vivo
address=/wifi.vivo.com.cn/192.168.1.1

# Oppo / ColorOS / Realme
address=/wifi.oppo.com/192.168.1.1
address=/wifi.oppomobile.com/192.168.1.1
address=/wifi.coloros.com/192.168.1.1

# Huawei
address=/connectivitycheck.platform.hicloud.com/192.168.1.1

# DHCP option 114 — Android 11+ official captive portal detection
dhcp-option=114,"http://192.168.1.1/generate_204"
