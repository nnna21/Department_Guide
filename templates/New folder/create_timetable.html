<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Timetable</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #c2e9fb 0%, #a1d8f0 100%);
            color: #1a2d3d;
            padding: 20px;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(200,240,255,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(160,220,245,0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }
        .card { 
            background: rgba(255, 255, 255, 0.55); 
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 30px; 
            margin-top: 50px; 
            border: 1px solid rgba(75, 175, 214, 0.3); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .title { 
            font-size: 1.8rem; 
            margin-bottom: 20px; 
            color: #2a8ab5; 
            text-align: center; 
            font-weight: 700;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #4a7a95; 
            font-weight: 500;
        }
        select, input { 
            width: 100%; 
            padding: 12px; 
            background: rgba(255, 255, 255, 0.7); 
            border: 1px solid rgba(75, 175, 214, 0.3); 
            border-radius: 12px; 
            color: #1a2d3d; 
            font-family: 'Inter', sans-serif;
        }
        select:focus, input:focus { 
            outline: none; 
            border-color: #2a8ab5; 
            background: rgba(255, 255, 255, 0.9);
        }
        select option {
            background: white;
            color: #1a2d3d;
        }
        .btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #4bafd6, #2a8ab5); 
            color: white; 
            border: none; 
            border-radius: 30px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: all 0.3s;
        }
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(42, 138, 181, 0.3);
        }
        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            color: #4a7a95; 
            text-decoration: none; 
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #2a8ab5;
        }
        
        /* Dark mode support */
        [data-theme="dark"] body {
            background: linear-gradient(160deg, #0f2a3a 0%, #1a3a4a 100%);
            color: #e8f0f5;
        }
        [data-theme="dark"] .card {
            background: rgba(25, 45, 60, 0.55);
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] .title {
            color: #4bafd6;
        }
        [data-theme="dark"] label {
            color: #b0d0e0;
        }
        [data-theme="dark"] select,
        [data-theme="dark"] input {
            background: rgba(40, 65, 85, 0.7);
            color: #e8f0f5;
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] select:focus,
        [data-theme="dark"] input:focus {
            background: rgba(50, 75, 95, 0.85);
            border-color: #4bafd6;
        }
        [data-theme="dark"] select option {
            background: #1a3a4a;
            color: #e8f0f5;
        }
        [data-theme="dark"] .back-link {
            color: #b0d0e0;
        }
        [data-theme="dark"] .back-link:hover {
            color: #4bafd6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">📅 Create New Timetable</div>
            <form method="POST">
                <div class="form-group">
                    <label>Program</label>
                    <select name="program" required>
                        <option value="">Select Program</option>
                        <option value="cyber">Cyber Security</option>
                        <option value="ce">Computer Engineering</option>
                        <option value="ist">Information Security Technology</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <select name="section" required>
                        <option value="">Select Section</option>
                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                    </select>
                </div>
                <button type="submit" class="btn">+ Create Timetable</button>
            </form>
            <a href="/admin/data" class="back-link">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
