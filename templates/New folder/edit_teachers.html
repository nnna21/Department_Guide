<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teachers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f17 0%, #1a1a2e 100%);
            color: #e0e0ff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #ae6717, #c47a2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-card { background: rgba(255,255,255,0.05); border-radius: 24px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .teacher-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .teacher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .teacher-title { font-size: 1.1rem; font-weight: 600; color: #ae6717; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e0e0ff; }
        .form-group input:focus { outline: none; border-color: #ae6717; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #94a3b8; }
        .btn { padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 500; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #ae6717, #c47a2a); color: white; }
        .btn-danger { background: rgba(239,68,68,0.2); color: #ef4444; }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
        .action-buttons { display: flex; gap: 15px; justify-content: flex-end; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">👥 Edit Teachers Directory</div>
            <a href="/admin/data" class="btn btn-secondary" style="background: rgba(255,255,255,0.1); color: #e0e0ff; padding: 10px 20px; border-radius: 30px; text-decoration: none;">← Back</a>
        </header>

        <form method="POST">
            <div id="teachers-container">
                {% for teacher in teachers %}
                <div class="teacher-card">
                    <div class="teacher-header">
                        <span class="teacher-title">Teacher {{ loop.index }}</span>
                        <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.teacher-card').remove()">Remove</button>
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>Name</label><input type="text" name="teacher_{{ loop.index0 }}_name" value="{{ teacher.name }}" required></div>
                        <div class="form-group"><label>Subject</label><input type="text" name="teacher_{{ loop.index0 }}_subject" value="{{ teacher.subject }}"></div>
                        <div class="form-group"><label>Email</label><input type="email" name="teacher_{{ loop.index0 }}_email" value="{{ teacher.email }}"></div>
                        <div class="form-group"><label>Phone</label><input type="text" name="teacher_{{ loop.index0 }}_phone" value="{{ teacher.phone }}"></div>
                        <div class="form-group"><label>Room</label><input type="text" name="teacher_{{ loop.index0 }}_room" value="{{ teacher.room }}"></div>
                        <div class="form-group"><label>Type</label><input type="text" name="teacher_{{ loop.index0 }}_type" value="{{ teacher.type }}" placeholder="Professor/Lecturer/Teacher"></div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div style="margin: 20px 0;">
                <button type="button" class="btn btn-primary" onclick="addTeacher()">+ Add New Teacher</button>
            </div>

            <input type="hidden" id="teacher_count" name="teacher_count" value="{{ teachers|length }}">

            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">💾 Save All Changes</button>
                <a href="/admin/data" class="btn btn-secondary" style="background: rgba(255,255,255,0.1); color: #e0e0ff; padding: 10px 20px; border-radius: 30px; text-decoration: none;">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        let teacherIndex = {{ teachers|length }};
        function addTeacher() {
            const container = document.getElementById('teachers-container');
            const newCard = document.createElement('div');
            newCard.className = 'teacher-card';
            newCard.innerHTML = `
                <div class="teacher-header">
                    <span class="teacher-title">New Teacher</span>
                    <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.teacher-card').remove()">Remove</button>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Name</label><input type="text" name="teacher_${teacherIndex}_name" required></div>
                    <div class="form-group"><label>Subject</label><input type="text" name="teacher_${teacherIndex}_subject"></div>
                    <div class="form-group"><label>Email</label><input type="email" name="teacher_${teacherIndex}_email"></div>
                    <div class="form-group"><label>Phone</label><input type="text" name="teacher_${teacherIndex}_phone"></div>
                    <div class="form-group"><label>Room</label><input type="text" name="teacher_${teacherIndex}_room"></div>
                    <div class="form-group"><label>Type</label><input type="text" name="teacher_${teacherIndex}_type" placeholder="Professor/Lecturer/Teacher"></div>
                </div>
            `;
            container.appendChild(newCard);
            document.getElementById('teacher_count').value = teacherIndex + 1;
            teacherIndex++;
        }
    </script>
</body>
</html>
