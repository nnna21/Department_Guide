<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Chat – Department Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --surface3: #475569;
      --border: rgba(174,103,23,0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #ae6717;
      --accent2: #c47a2a;
      --accent3: #8b4f12;
      --glow-a: rgba(174,103,23,0.12);
      --r-card: 16px;
      --r-pill: 999px;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --transition: 0.2s ease;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --surface3: #e2e8f0;
      --border: rgba(174,103,23,0.2);
      --text: #0f172a;
      --text-muted: #475569;
      --glow-a: rgba(174,103,23,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .back-btn { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: var(--r-pill); color: var(--text); text-decoration: none; font-size: 0.85rem; transition: all 0.2s; }
    .back-btn:hover { background: var(--glow-a); border-color: var(--accent); }
    .logout-btn { padding: 0.5rem 1rem; border: 1px solid #ef4444; border-radius: var(--r-pill); color: #ef4444; background: transparent; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .logout-btn:hover { background: rgba(239,68,68,0.1); }
    .theme-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .theme-btn:hover { background: var(--glow-a); border-color: var(--accent); }

    /* Login Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .modal-card h2 { margin-bottom: 0.5rem; color: var(--accent); }
    .modal-card p { margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem; }
    .modal-card input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }
    .modal-card input:focus { outline: none; border-color: var(--accent); }
    .modal-card button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: var(--r-pill);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 0.5rem; }
    .success-msg { color: #10b981; font-size: 0.8rem; margin-top: 0.5rem; }

    .chat-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 100px 1.5rem 2rem;
    }
    .chat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      overflow: hidden;
    }
    .chat-header {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .chat-header h2 { font-size: 1.2rem; font-weight: 600; color: white; }
    .user-info { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .user-badge { background: rgba(0,0,0,0.35); padding: 0.35rem 1rem; border-radius: var(--r-pill); font-size: 0.8rem; color: white; font-weight: 500; }
    .date-badge { font-size: 0.7rem; background: rgba(0,0,0,0.35); padding: 0.35rem 1rem; border-radius: var(--r-pill); color: white; }

    /* Messages Area */
    .messages-area {
      height: 480px;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--bg);
    }
    
    .message {
      max-width: 70%;
      padding: 0.8rem 1rem;
      border-radius: 20px;
      position: relative;
      word-wrap: break-word;
    }
    
    .message-left {
      align-self: flex-start;
      background: var(--surface2);
      border-bottom-left-radius: 5px;
    }
    .message-left .msg-name {
      color: var(--accent);
    }
    
    .message-right {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: white;
      border-bottom-right-radius: 5px;
    }
    .message-right .msg-name {
      color: rgba(255,255,255,0.85);
    }
    
    .msg-name { 
      font-size: 0.7rem; 
      font-weight: 700; 
      margin-bottom: 0.25rem; 
      display: block;
    }
    .msg-text { 
      font-size: 0.85rem; 
      line-height: 1.4; 
    }
    .msg-text a { 
      color: inherit; 
      text-decoration: underline; 
    }
    .file-info { 
      font-size: 0.65rem; 
      margin-left: 0.3rem; 
      opacity: 0.8; 
    }
    .msg-time { 
      font-size: 0.55rem; 
      margin-top: 0.3rem; 
      text-align: right; 
      opacity: 0.7; 
    }

    /* Input Area */
    .input-area {
      padding: 1rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .input-area input[type="text"] {
      flex: 2;
      padding: 0.7rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
    }
    .input-area input[type="text"]:focus { outline: none; border-color: var(--accent); }
    .file-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .file-btn:hover { background: var(--glow-a); border-color: var(--accent); }
    .send-btn {
      padding: 0.7rem 1.5rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: var(--r-pill);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .empty-chat { text-align: center; padding: 2rem; color: var(--text-muted); font-style: italic; }
    .footer-note { text-align: center; margin-top: 1rem; font-size: 0.7rem; color: var(--text-muted); }

    @media (max-width: 600px) {
      .chat-container { padding-top: 90px; }
      .messages-area { height: 380px; }
      .message { max-width: 85%; }
      .input-area { flex-direction: column; }
      .input-area input[type="text"] { width: 100%; }
      .file-btn, .send-btn { width: 100%; text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">💬 Faculty Chat</div>
    <div style="display: flex; gap: 0.8rem; align-items: center;">
      <a href="/timetable?program=cyber&section=A" class="back-btn">← Back to Guide</a>
      <button id="logoutBtn" class="logout-btn" style="display: none;">🚪 Logout</button>
      <button id="themeToggle" class="theme-btn">☀️</button>
    </div>
  </div>
</header>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="modal-card">
    <h2>🔐 Faculty Login</h2>
    <p>Please enter your name as registered in the faculty directory</p>
    <input type="text" id="loginName" placeholder="Full Name (e.g., Dr. Hina Khalid)">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Login / Set Password</button>
    <div id="loginMessage"></div>
    <p style="margin-top: 1rem; font-size: 0.7rem;">⚠️ First time logging in? Enter a password to set it up.</p>
  </div>
</div>

<div class="chat-container" id="chatContainer" style="display: none;">
  <div class="chat-card">
    <div class="chat-header">
      <h2>📢 Faculty Communication Hub</h2>
      <div class="user-info">
        <span class="user-badge" id="currentUserBadge">—</span>
        <span class="date-badge" id="todayDate"></span>
      </div>
    </div>
    <div class="messages-area" id="messagesContainer">
      <div class="empty-chat">Loading messages...</div>
    </div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
      <label for="fileInput" class="file-btn">📎 File</label>
      <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.jpg,.png,.txt,.zip,.xlsx,.pptx" style="display:none;">
      <button class="send-btn" id="sendBtn" disabled>Send</button>
    </div>
  </div>
  <div class="footer-note">
    💡 Messages and files are automatically deleted at the end of each day
  </div>
</div>

<script>
  // ==================== GLOBAL STATE ====================
  let currentUser = null;
  let isAuthenticated = false;
  let messagesInterval = null;
  let lastMessageId = null;  // Track last message timestamp to play sound only for new ones

  // DOM elements
  const loginModal = document.getElementById('loginModal');
  const chatContainer = document.getElementById('chatContainer');
  const loginName = document.getElementById('loginName');
  const loginPassword = document.getElementById('loginPassword');
  const loginBtn = document.getElementById('loginBtn');
  const loginMessage = document.getElementById('loginMessage');
  const logoutBtn = document.getElementById('logoutBtn');
  const currentUserBadge = document.getElementById('currentUserBadge');
  const messagesDiv = document.getElementById('messagesContainer');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const fileInput = document.getElementById('fileInput');

  // ==================== NOTIFICATION SOUND ====================
  function playNotificationSound() {
    try {
      // Create a simple beep using Web Audio API
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 880; // Higher pitch for notification
      gainNode.gain.value = 0.3; // Volume
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
      oscillator.stop(audioContext.currentTime + 0.5);
      
      // Resume audio context if it was suspended (browsers require user interaction first)
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    } catch(e) {
      console.log('Audio not supported:', e);
    }
  }

  // Helper functions
  function formatFileSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function formatTime(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Load messages and display with proper alignment
  async function loadMessages() {
    if (!isAuthenticated || !currentUser) return;
    try {
      const res = await fetch('/api/get_messages');
      const messages = await res.json();
      
      // Check if there's a NEW message (not from current user)
      if (messages.length > 0 && lastMessageId !== messages[messages.length - 1].timestamp) {
        const lastMsg = messages[messages.length - 1];
        // Only play sound if message is from someone else
        if (lastMsg.name !== currentUser) {
          playNotificationSound();
        }
        lastMessageId = lastMsg.timestamp;
      }
      
      if (messages.length === 0) {
        messagesDiv.innerHTML = '<div class="empty-chat">✨ No messages yet. Be the first to start a conversation!</div>';
        return;
      }

      let html = '';
      for (let msg of messages) {
        const isOwn = (msg.name === currentUser);
        const alignClass = isOwn ? 'message-right' : 'message-left';
        
        let messageContent = escapeHtml(msg.message);
        if (msg.filename) {
          messageContent = `📎 <a href="/api/download_chat_file/${msg.filename}" target="_blank">${escapeHtml(msg.original_filename)}</a> <span class="file-info">(${formatFileSize(msg.file_size)})</span>`;
        }
        
        html += `
          <div class="message ${alignClass}">
            <span class="msg-name">${escapeHtml(msg.name)}</span>
            <div class="msg-text">${messageContent}</div>
            <div class="msg-time">${formatTime(msg.timestamp)}</div>
          </div>
        `;
      }
      messagesDiv.innerHTML = html;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } catch(e) {
      console.error('Error loading messages:', e);
    }
  }

  // Send text message
  async function sendMessage() {
    if (!isAuthenticated) return;
    const message = messageInput.value.trim();
    if (!message) {
      alert('Please enter a message');
      return;
    }
    
    try {
      await fetch('/api/send_message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
      });
      messageInput.value = '';
      await loadMessages();
    } catch(e) {
      console.error('Error sending message:', e);
      alert('Failed to send message.');
    }
  }

  // Upload file
  async function uploadFile(file) {
    const formData = new FormData();
    formData.append('file', file);
    
    try {
      sendBtn.disabled = true;
      sendBtn.textContent = 'Uploading...';
      const res = await fetch('/api/upload_chat_file', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
      } else {
        await loadMessages();
      }
    } catch(e) {
      console.error('Upload failed:', e);
      alert('File upload failed.');
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
    }
  }

  // Authentication
  async function checkAuth() {
    try {
      const res = await fetch('/api/check_auth');
      const data = await res.json();
      if (data.authenticated) {
        isAuthenticated = true;
        currentUser = data.name;
        loginModal.style.display = 'none';
        chatContainer.style.display = 'block';
        currentUserBadge.textContent = `👤 ${currentUser}`;
        logoutBtn.style.display = 'inline-block';
        messageInput.disabled = false;
        sendBtn.disabled = false;
        updateDateBadge();
        await loadMessages();
        if (messagesInterval) clearInterval(messagesInterval);
        messagesInterval = setInterval(loadMessages, 3000);
      } else {
        loginModal.style.display = 'flex';
        chatContainer.style.display = 'none';
        logoutBtn.style.display = 'none';
      }
    } catch(e) {
      console.error('Auth check failed:', e);
    }
  }

  async function handleLogin() {
    const name = loginName.value.trim();
    const password = loginPassword.value.trim();
    
    if (!name) {
      loginMessage.innerHTML = '<div class="error-msg">Please enter your name</div>';
      return;
    }
    
    loginMessage.innerHTML = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking...';
    
    try {
      const res = await fetch('/api/faculty_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, password: password })
      });
      const data = await res.json();
      
      if (data.success) {
        if (data.first_time) {
          loginMessage.innerHTML = '<div class="success-msg">✅ Password set successfully! Logging in...</div>';
        }
        loginName.value = '';
        loginPassword.value = '';
        await checkAuth();
      } else {
        loginMessage.innerHTML = `<div class="error-msg">${data.error || 'Login failed'}</div>`;
      }
    } catch(e) {
      loginMessage.innerHTML = '<div class="error-msg">Connection error. Please try again.</div>';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login / Set Password';
    }
  }

  async function handleLogout() {
    try {
      await fetch('/api/faculty_logout', { method: 'POST' });
      if (messagesInterval) clearInterval(messagesInterval);
      isAuthenticated = false;
      currentUser = null;
      await checkAuth();
    } catch(e) {
      console.error('Logout failed:', e);
    }
  }

  function updateDateBadge() {
    const today = new Date();
    const dateStr = today.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const dateBadge = document.getElementById('todayDate');
    if (dateBadge) dateBadge.textContent = dateStr;
  }

  // Event listeners
  loginBtn.addEventListener('click', handleLogin);
  loginPassword.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
  logoutBtn.addEventListener('click', handleLogout);
  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await uploadFile(file);
    fileInput.value = '';
  });

  // Theme toggle
  const themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  // Initialize
  checkAuth();
</script>
</body>
</html>
