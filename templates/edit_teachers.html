<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teachers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #c2e9fb 0%, #a1d8f0 100%);
            color: #1a2d3d;
            padding: 20px;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(200,240,255,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(160,220,245,0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .logo { 
            font-size: 1.8rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #2a8ab5, #4bafd6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .section-card { 
            background: rgba(255, 255, 255, 0.55); 
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 25px; 
            border: 1px solid rgba(75, 175, 214, 0.3); 
        }
        .teacher-card { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(8px);
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(75, 175, 214, 0.2);
        }
        .teacher-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .teacher-title { 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: #2a8ab5; 
        }
        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px; 
            background: rgba(255, 255, 255, 0.7); 
            border: 1px solid rgba(75, 175, 214, 0.3); 
            border-radius: 8px; 
            color: #1a2d3d; 
        }
        .form-group input:focus, .form-group select:focus { 
            outline: none; 
            border-color: #2a8ab5; 
            background: rgba(255, 255, 255, 0.9);
        }
        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            font-size: 0.8rem; 
            color: #4a7a95; 
        }
        .btn { 
            padding: 10px 20px; 
            border-radius: 30px; 
            text-decoration: none; 
            font-weight: 500; 
            cursor: pointer; 
            border: none; 
            transition: all 0.3s; 
        }
        .btn-primary { 
            background: linear-gradient(135deg, #4bafd6, #2a8ab5); 
            color: white; 
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(42, 138, 181, 0.3);
        }
        .btn-secondary { 
            background: rgba(255, 255, 255, 0.6); 
            color: #1a2d3d; 
            border: 1px solid rgba(75, 175, 214, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        .btn-danger { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid #ef4444;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-sm { 
            padding: 5px 12px; 
            font-size: 0.8rem; 
        }
        .action-buttons { 
            display: flex; 
            gap: 15px; 
            justify-content: flex-end; 
            margin-top: 25px; 
        }
        
        /* Dark mode support */
        [data-theme="dark"] body {
            background: linear-gradient(160deg, #0f2a3a 0%, #1a3a4a 100%);
            color: #e8f0f5;
        }
        [data-theme="dark"] .logo {
            background: linear-gradient(135deg, #4bafd6, #6bc0e8);
            -webkit-background-clip: text;
        }
        [data-theme="dark"] .section-card {
            background: rgba(25, 45, 60, 0.55);
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] .teacher-card {
            background: rgba(25, 45, 60, 0.45);
            border-color: rgba(75, 175, 214, 0.2);
        }
        [data-theme="dark"] .teacher-title {
            color: #4bafd6;
        }
        [data-theme="dark"] .form-group input,
        [data-theme="dark"] .form-group select {
            background: rgba(40, 65, 85, 0.7);
            color: #e8f0f5;
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] .form-group input:focus,
        [data-theme="dark"] .form-group select:focus {
            background: rgba(50, 75, 95, 0.85);
            border-color: #4bafd6;
        }
        [data-theme="dark"] .form-group label {
            color: #b0d0e0;
        }
        [data-theme="dark"] .btn-secondary {
            background: rgba(30, 50, 65, 0.5);
            color: #e8f0f5;
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] .btn-secondary:hover {
            background: rgba(40, 60, 75, 0.7);
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .action-buttons .btn { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">👥 Edit Teachers Directory</div>
            <a href="/admin/data" class="btn btn-secondary">← Back to Dashboard</a>
        </header>

        <div class="section-card">
            <form method="POST">
                <div id="teachers-container">
                    {% for teacher in teachers %}
                    <div class="teacher-card">
                        <div class="teacher-header">
                            <span class="teacher-title">Teacher {{ loop.index }}</span>
                            <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.teacher-card').remove()">Remove</button>
                        </div>
                        <div class="form-grid">
                            <div class="form-group"><label>Name</label><input type="text" name="teacher_{{ loop.index0 }}_name" value="{{ teacher.name }}" required></div>
                            <div class="form-group"><label>Subject</label><input type="text" name="teacher_{{ loop.index0 }}_subject" value="{{ teacher.subject }}"></div>
                            <div class="form-group"><label>Email</label><input type="email" name="teacher_{{ loop.index0 }}_email" value="{{ teacher.email }}"></div>
                            <div class="form-group"><label>Phone</label><input type="text" name="teacher_{{ loop.index0 }}_phone" value="{{ teacher.phone }}"></div>
                            <div class="form-group"><label>Room</label><input type="text" name="teacher_{{ loop.index0 }}_room" value="{{ teacher.room }}"></div>
                            <div class="form-group"><label>Type</label><input type="text" name="teacher_{{ loop.index0 }}_type" value="{{ teacher.type }}" placeholder="Professor/Lecturer/Teacher"></div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div style="margin: 20px 0;">
                    <button type="button" class="btn btn-primary" onclick="addTeacher()">+ Add New Teacher</button>
                </div>

                <input type="hidden" id="teacher_count" name="teacher_count" value="{{ teachers|length }}">

                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">💾 Save All Changes</button>
                    <a href="/admin/data" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        let teacherIndex = {{ teachers|length }};
        function addTeacher() {
            const container = document.getElementById('teachers-container');
            const newCard = document.createElement('div');
            newCard.className = 'teacher-card';
            newCard.innerHTML = `
                <div class="teacher-header">
                    <span class="teacher-title">New Teacher</span>
                    <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.teacher-card').remove()">Remove</button>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Name</label><input type="text" name="teacher_${teacherIndex}_name" required></div>
                    <div class="form-group"><label>Subject</label><input type="text" name="teacher_${teacherIndex}_subject"></div>
                    <div class="form-group"><label>Email</label><input type="email" name="teacher_${teacherIndex}_email"></div>
                    <div class="form-group"><label>Phone</label><input type="text" name="teacher_${teacherIndex}_phone"></div>
                    <div class="form-group"><label>Room</label><input type="text" name="teacher_${teacherIndex}_room"></div>
                    <div class="form-group"><label>Type</label><input type="text" name="teacher_${teacherIndex}_type" placeholder="Professor/Lecturer/Teacher"></div>
                </div>
            `;
            container.appendChild(newCard);
            document.getElementById('teacher_count').value = teacherIndex + 1;
            teacherIndex++;
        }
    </script>
</body>
</html>
