<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Timetable - {{ filename }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #c2e9fb 0%, #a1d8f0 100%);
            color: #1a2d3d;
            padding: 20px;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(200,240,255,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(160,220,245,0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .logo { 
            font-size: 1.8rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #2a8ab5, #4bafd6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .section-card { 
            background: rgba(255, 255, 255, 0.55); 
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 25px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(75, 175, 214, 0.3); 
        }
        .section-title { 
            font-size: 1.3rem; 
            margin-bottom: 20px; 
            color: #2a8ab5; 
        }
        .day-card { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(8px);
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(75, 175, 214, 0.2);
        }
        .day-header { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 15px; 
            color: #2a8ab5; 
        }
        .class-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 10px; 
            flex-wrap: wrap; 
        }
        .class-row input, .class-row select { 
            background: rgba(255, 255, 255, 0.7); 
            border: 1px solid rgba(75, 175, 214, 0.3); 
            padding: 8px 12px; 
            border-radius: 8px; 
            color: #1a2d3d; 
            flex: 1; 
            min-width: 120px; 
        }
        .class-row input:focus, .class-row select:focus { 
            outline: none; 
            border-color: #2a8ab5; 
            background: rgba(255, 255, 255, 0.9);
        }
        .btn { 
            padding: 10px 20px; 
            border-radius: 30px; 
            text-decoration: none; 
            font-weight: 500; 
            cursor: pointer; 
            border: none; 
            transition: all 0.3s; 
        }
        .btn-primary { 
            background: linear-gradient(135deg, #4bafd6, #2a8ab5); 
            color: white; 
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(42, 138, 181, 0.3);
        }
        .btn-secondary { 
            background: rgba(255, 255, 255, 0.6); 
            color: #1a2d3d; 
            border: 1px solid rgba(75, 175, 214, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        .btn-danger { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid #ef4444;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-sm { 
            padding: 5px 12px; 
            font-size: 0.8rem; 
        }
        .add-btn { 
            margin-top: 10px; 
        }
        .action-buttons { 
            display: flex; 
            gap: 15px; 
            justify-content: flex-end; 
            margin-top: 20px; 
        }
        
        /* Dark mode support */
        [data-theme="dark"] body {
            background: linear-gradient(160deg, #0f2a3a 0%, #1a3a4a 100%);
            color: #e8f0f5;
        }
        [data-theme="dark"] .logo {
            background: linear-gradient(135deg, #4bafd6, #6bc0e8);
            -webkit-background-clip: text;
        }
        [data-theme="dark"] .section-card {
            background: rgba(25, 45, 60, 0.55);
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] .section-title,
        [data-theme="dark"] .day-header {
            color: #4bafd6;
        }
        [data-theme="dark"] .day-card {
            background: rgba(25, 45, 60, 0.45);
            border-color: rgba(75, 175, 214, 0.2);
        }
        [data-theme="dark"] .class-row input,
        [data-theme="dark"] .class-row select {
            background: rgba(40, 65, 85, 0.7);
            color: #e8f0f5;
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] .class-row input:focus,
        [data-theme="dark"] .class-row select:focus {
            background: rgba(50, 75, 95, 0.85);
            border-color: #4bafd6;
        }
        [data-theme="dark"] .btn-secondary {
            background: rgba(30, 50, 65, 0.5);
            color: #e8f0f5;
            border-color: rgba(75, 175, 214, 0.25);
        }
        [data-theme="dark"] .btn-secondary:hover {
            background: rgba(40, 60, 75, 0.7);
        }

        @media (max-width: 768px) {
            .class-row { flex-direction: column; }
            .class-row input, .class-row select { width: 100%; }
            .action-buttons { flex-direction: column; }
            .action-buttons .btn { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">✏️ Editing: {{ filename }}</div>
            <a href="/admin/data" class="btn btn-secondary">← Back to Dashboard</a>
        </header>

        <form method="POST">
            {% for day, data in data.schedule.items() %}
            <div class="day-card">
                <div class="day-header">{{ day }}</div>
                <div id="classes-{{ day }}">
                    {% for class in data.classes %}
                    <div class="class-row">
                        <input type="time" name="{{ day }}_{{ loop.index0 }}_time_start" value="{{ class.time_start }}" placeholder="Start Time">
                        <input type="time" name="{{ day }}_{{ loop.index0 }}_time_end" value="{{ class.time_end }}" placeholder="End Time">
                        <input type="text" name="{{ day }}_{{ loop.index0 }}_subject" value="{{ class.subject }}" placeholder="Subject">
                        <input type="text" name="{{ day }}_{{ loop.index0 }}_teacher" value="{{ class.teacher }}" placeholder="Teacher">
                        <input type="text" name="{{ day }}_{{ loop.index0 }}_room" value="{{ class.room }}" placeholder="Room">
                        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Remove</button>
                    </div>
                    {% endfor %}
                </div>
                <button type="button" class="btn btn-secondary btn-sm add-btn" onclick="addClass('{{ day }}')">+ Add Class</button>
                <input type="hidden" name="{{ day }}_count" id="{{ day }}_count" value="{{ data.classes|length }}">
            </div>
            {% endfor %}

            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                <a href="/admin/data" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        function addClass(day) {
            const container = document.getElementById(`classes-${day}`);
            const count = container.children.length;
            const newRow = document.createElement('div');
            newRow.className = 'class-row';
            newRow.innerHTML = `
                <input type="time" name="${day}_${count}_time_start" placeholder="Start Time">
                <input type="time" name="${day}_${count}_time_end" placeholder="End Time">
                <input type="text" name="${day}_${count}_subject" placeholder="Subject">
                <input type="text" name="${day}_${count}_teacher" placeholder="Teacher">
                <input type="text" name="${day}_${count}_room" placeholder="Room">
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Remove</button>
            `;
            container.appendChild(newRow);
            document.getElementById(`${day}_count`).value = count + 1;
        }
    </script>
</body>
</html>
